# Grounding v2 cosine: BCSS + CONCH hybrid supervision with cosine distance loss.
# Ablation variant of grounding_v2.yaml — identical except loss_type: cosine.
# Final ablation cell in the 2×2 matrix (source × loss_type).

run_name_prefix: grounded_v2_cosine

# Data — TCGA-BRCA slides with BCSS overlap
embeddings_dir: data/processed/embeddings/tcga_brca
instruction_train: data/processed/slideinstruction/train.json
instruction_val: data/processed/slideinstruction/val.json
max_vision_tokens: 1024

bcss_masks_dir: data/processed/bcss_patch_masks
pseudo_gt_cache_dir: data/processed/pseudo_gt_cache

# Model (same)
llm_repo: meta-llama/Llama-3.2-3B-Instruct
vision_dim: 768
llm_hidden_dim: 3072
load_in_4bit: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  bias: none

# Loss — CHANGED: cosine distance instead of KL
loss:
  lambda_grounding: 0.3
  lambda_faithfulness: 0.1
  loss_type: cosine   # kl | cosine

# Grounding target routing: BCSS hybrid
grounding:
  source: bcss_hybrid
  conch_repo: MahmoodLab/conchv1_5
  cosine_temperature: 0.1

attn_layer: 14

optimizer:
  name: adamw
  lr_adapter: 1.0e-4
  lr_lora: 5.0e-5
  weight_decay: 0.01

scheduler:
  name: cosine
  warmup_steps: 100

training:
  epochs: 3
  batch_size: 1
  gradient_accumulation: 16
  mixed_precision: bf16
  gradient_checkpointing: true
  max_grad_norm: 1.0
  eval_every: 200
  save_every: 500

output_dir: checkpoints

wandb:
  project: patholens-vlm
  tags: [grounded, v2, bcss-hybrid, cosine]
log_every: 10
