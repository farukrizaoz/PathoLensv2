# Smoke v2 — retuned after the faithfulness + grounding double-softmax fixes.
# Old config used lambda_grounding=0.3 and lambda_faithfulness=0.1 in a regime
# where both losses were effectively no-ops. With the bugs fixed, those
# weights crushed caption (BLEU 0.057 -> 0.005). Here we lower λ aggressively,
# add a 2-epoch caption-only warmup, and run 8 epochs instead of 4 to give the
# two losses room to co-converge.

run_name_prefix: grounded_smoke_v2

embeddings_dir: data/processed/embeddings/tcga_brca
instruction_train: data/processed/slideinstruction_smoke/train.json
instruction_val: data/processed/slideinstruction_smoke/val.json
max_vision_tokens: 1024

bcss_masks_dir: data/processed/bcss_patch_masks
pseudo_gt_cache_dir: data/processed/pseudo_gt_cache

llm_repo: meta-llama/Llama-3.2-3B-Instruct
vision_dim: 768
llm_hidden_dim: 3072
load_in_4bit: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  bias: none

loss:
  # Retuned: grounding loss magnitudes are 2-35 in the post-fix regime, so we
  # weight it lower to keep the caption objective dominant.
  lambda_grounding: 0.1
  lambda_faithfulness: 0.01
  # Caption-only for the first N epochs so the LLM adapter learns to read
  # vision tokens before grounding/faithfulness compete for gradient.
  grounding_warmup_epochs: 2.0
  loss_type: kl

grounding:
  source: bcss_hybrid
  conch_repo: MahmoodLab/conchv1_5
  cosine_temperature: 0.1

attn_layer: 14

optimizer:
  name: adamw
  lr_adapter: 1.0e-4
  lr_lora: 5.0e-5
  weight_decay: 0.01

scheduler:
  name: cosine
  warmup_steps: 4

training:
  epochs: 8
  batch_size: 1
  gradient_accumulation: 2
  mixed_precision: bf16
  gradient_checkpointing: true
  max_grad_norm: 1.0
  eval_every: 16
  save_every: 32

output_dir: checkpoints

wandb:
  project: patholens-vlm
  tags: [smoke, bcss-hybrid, kl, v2, retuned]
log_every: 2
