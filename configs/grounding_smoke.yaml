# Smoke config: end-to-end pipeline validation on ~10 BCSS∩SlideChat BRCA slides.
# Goal is a consistent, runnable pass (not SOTA metrics): few epochs, small accum,
# frequent eval/save. BCSS-hybrid grounding with CONCH pseudo-GT fallback.

run_name_prefix: grounded_smoke

# Data — smoke instruction set (only the 10 matched slides)
embeddings_dir: data/processed/embeddings/tcga_brca
instruction_train: data/processed/slideinstruction_smoke/train.json
instruction_val: data/processed/slideinstruction_smoke/val.json
max_vision_tokens: 1024

# BCSS patch masks (built by scripts/06_prepare_bcss_masks.py build)
bcss_masks_dir: data/processed/bcss_patch_masks
pseudo_gt_cache_dir: data/processed/pseudo_gt_cache

# Model
llm_repo: meta-llama/Llama-3.2-3B-Instruct
vision_dim: 768
llm_hidden_dim: 3072
load_in_4bit: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  bias: none

loss:
  lambda_grounding: 0.3
  lambda_faithfulness: 0.1
  loss_type: kl

grounding:
  source: bcss_hybrid
  conch_repo: MahmoodLab/conchv1_5
  cosine_temperature: 0.1

attn_layer: 14

optimizer:
  name: adamw
  lr_adapter: 1.0e-4
  lr_lora: 5.0e-5
  weight_decay: 0.01

scheduler:
  name: cosine
  warmup_steps: 2

training:
  epochs: 4
  batch_size: 1
  gradient_accumulation: 2
  mixed_precision: bf16
  gradient_checkpointing: true
  max_grad_norm: 1.0
  eval_every: 8
  save_every: 16

output_dir: checkpoints

wandb:
  project: patholens-vlm
  tags: [smoke, bcss-hybrid, kl]
log_every: 2
