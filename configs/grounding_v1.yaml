# Grounding v1: CONCH pseudo-supervision + faithfulness regularization.
# Inherits caption_baseline.yaml, only overrides loss weights and run name.

# Note: implement as deep merge with caption_baseline.yaml in trainer.

run_name_prefix: grounded_v1

# Data (same as baseline)
embeddings_dir: data/processed/embeddings/tcga_brca
instruction_train: data/processed/slideinstruction/train.json
instruction_val: data/processed/slideinstruction/val.json
max_vision_tokens: 1024

# Model (same)
llm_repo: meta-llama/Llama-3.2-3B-Instruct
vision_dim: 768
llm_hidden_dim: 3072
load_in_4bit: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  bias: none

# *** CHANGED: enable grounding loss + faithfulness reg ***
loss:
  lambda_grounding: 0.3
  lambda_faithfulness: 0.1

# Grounding ground truth source: CONCH zero-shot pseudo-supervision
grounding:
  source: conch_pseudo
  conch_repo: MahmoodLab/conchv1_5
  cosine_temperature: 0.1
  cosine_threshold: 0.3    # patches with cosine sim < threshold zeroed out

# Attention extraction (which LLM layers to use)
attention_extraction:
  layers: [12, 14, 16, 18]  # to be tuned in Hafta 3 based on visual inspection
  heads: "all"              # average across heads (or specify e.g. [24])

# Optimizer (same)
optimizer:
  name: adamw
  lr_adapter: 1.0e-4
  lr_lora: 5.0e-5
  weight_decay: 0.01

scheduler:
  name: cosine
  warmup_steps: 100

# Training
training:
  epochs: 3
  batch_size: 1
  gradient_accumulation: 16
  mixed_precision: bf16
  gradient_checkpointing: true
  max_grad_norm: 1.0
  eval_every: 200
  save_every: 500

# Init from baseline (transfer learning, faster convergence)
init_from: checkpoints/baseline_latest

output_dir: checkpoints

wandb:
  project: patholens-vlm
  tags: [grounded, v1, conch-pseudo]
log_every: 10
